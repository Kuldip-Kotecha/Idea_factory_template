<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Factory Notification</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" style="width: 600px; max-width: 100%; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 32px 40px; text-align: center;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 700;">
                                Idea Factory
                            </h1>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 32px 40px;">
                            <h2 style="margin: 0 0 16px; color: #1e293b; font-size: 20px; font-weight: 600;"
                                th:text="${subject}">Notification</h2>
                            <p style="margin: 0 0 24px; color: #475569; font-size: 16px; line-height: 1.6;"
                               th:text="${message}">Message content goes here.</p>

                            <!-- CTA Button (optional) -->
                            <table role="presentation" style="margin: 0;" th:if="${ctaUrl != null}">
                                <tr>
                                    <td style="background: #4f46e5; border-radius: 8px;">
                                        <a th:href="${ctaUrl}"
                                           style="display: inline-block; padding: 12px 24px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px;">
                                            View Report
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background: #f8fafc; padding: 24px 40px; border-top: 1px solid #e2e8f0; text-align: center;">
                            <p style="margin: 0 0 8px; color: #94a3b8; font-size: 12px;">
                                This is an automated message from Idea Factory.
                            </p>
                            <p style="margin: 0; color: #94a3b8; font-size: 12px;">
                                If you have questions, contact support at
                                <a th:href="'mailto:' + ${supportEmail}"
                                   style="color: #4f46e5; text-decoration: none;"
                                   th:text="${supportEmail}">support@example.com</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>

# Integration Test Profile - User Service
# This profile uses real Google OAuth2 and MySQL (not mocks)

server:
  port: 8083

spring:
  application:
    name: user-service

  # Real MySQL database (Aiven or local)
  datasource:
    url: ${SPRING_DATASOURCE_URL_USER}
    username: ${SPRING_DATASOURCE_USERNAME_USER}
    password: ${SPRING_DATASOURCE_PASSWORD_USER}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # Real Redis for session/cache
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED}

  # Google OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${OAUTH2_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

# App Configuration
app:
  frontend-url: ${APP_FRONTEND_URL}
  storage:
    type: ${APP_STORAGE_TYPE}

# Disable tracing during tests
management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint:

# Logging
logging:
  level:
    com.interviewcoach.user: INFO
    org.springframework: WARN
    org.springframework.security: DEBUG

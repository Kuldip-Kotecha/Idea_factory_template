server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy
            client-secret: dummy

env:
  media-service:
    url: http://dummy-media-service

jwt:
  secret: dummySecretKeyThatIsAtLeast32BytesLongForTesting
  expiration: 3600

# Mock media service url
MEDIA_SERVICE_URL: http://localhost:8083

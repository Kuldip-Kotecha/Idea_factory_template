# Integration Test Profile - Core Service
# This profile uses REAL external services (not mocks)
# Environment variables MUST be set before running tests

spring:
  # Real MySQL database (set SPRING_DATASOURCE_URL env var)
  datasource:
    url: ${SPRING_DATASOURCE_URL_CORE}
    username: ${SPRING_DATASOURCE_USERNAME_CORE}
    password: ${SPRING_DATASOURCE_PASSWORD_CORE}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # Real Redis (set SPRING_DATA_REDIS_HOST env var)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED}

  # Real RabbitMQ (set SPRING_RABBITMQ_HOST env var)
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED}

# AI Service URL for resume preview tests
ai:
  service:
    url: ${UTILITY_SERVICE_URL}

# Disable tracing during tests
management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint:

# Logging
logging:
  level:
    com.interviewcoach: INFO
    org.springframework: WARN
    org.hibernate: WARN

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

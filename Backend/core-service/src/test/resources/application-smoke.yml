spring:
  application:
    name: core-service-smoke

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

ai:
  service:
    url: http://localhost:8085

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  level:
    com.interviewcoach: INFO
    org.springframework: WARN

MEDIA_SERVICE_URL: http://localhost:8082
UTILITY_SERVICE_URL: http://localhost:8085
USER_SERVICE_URL: http://localhost:8083
JWT_SECRET: test-secret-key-for-testing-purposes-only-12345678901234567890

app:
  storage:
    type: cloudinary

CLOUDINARY_CLOUD_NAME: test-cloud
CLOUDINARY_API_KEY: test-key
CLOUDINARY_API_SECRET: test-secret
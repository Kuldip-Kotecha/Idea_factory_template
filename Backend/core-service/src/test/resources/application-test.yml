spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
  data:
    redis:
      host: localhost
      port: 6379

ai:
  service:
    url: http://localhost:8084

management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.ideafactory.core: WARN

MEDIA_SERVICE_URL: http://localhost:8082
UTILITY_SERVICE_URL: http://localhost:8085
USER_SERVICE_URL: http://localhost:8083
JWT_SECRET: test-secret-key-for-testing-purposes-only-12345678901234567890

CLOUDINARY_CLOUD_NAME: test-cloud
CLOUDINARY_API_KEY: test-key
CLOUDINARY_API_SECRET: test-secret

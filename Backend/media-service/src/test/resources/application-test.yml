spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672

# Storage is mocked in all media-service unit tests.
# No real StorageService bean is needed — CloudinaryStorageServiceImpl
# is conditionally loaded only when app.storage.type=cloudinary (production).

# AI Service URL (required for Feign client)
UTILITY_SERVICE_URL: http://localhost:8085
CORE_SERVICE_URL: http://localhost:8081
JWT_SECRET: test-secret-key-for-testing-purposes-only-12345678901234567890

management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.ideafactory.media: WARN

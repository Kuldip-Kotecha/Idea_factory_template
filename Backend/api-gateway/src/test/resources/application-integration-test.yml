# Integration Test Profile - API Gateway
# This profile tests the real API Gateway routing and JWT validation

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

api:
  version: v1

app:
  services:
    core-service: ${CORE_SERVICE_URL}
    user-service: ${USER_SERVICE_URL}
    media-service: ${MEDIA_SERVICE_URL}
    utility-service: ${UTILITY_SERVICE_URL}
    notification-service: ${NOTIFICATION_SERVICE_URL}
  frontend:
    url: "http://localhost:4200,https://interview-coach-kk.vercel.app"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: oauth-login
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/oauth2/**, /login/**
        - id: utility-service
          uri: ${UTILITY_SERVICE_URL}
          predicates:
            - Path=/api/ai/**
        - id: core-service-faqs
          uri: ${CORE_SERVICE_URL}
          predicates:
            - Path=/api/faqs/**, /api/faqs
        - id: core-service-interviews
          uri: ${CORE_SERVICE_URL}
          predicates:
            - Path=/api/interviews/**
        - id: user-service-auth
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/users/**

logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.ideafactory.gateway: INFO

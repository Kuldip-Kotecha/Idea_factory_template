<div class="min-h-screen flex items-center justify-center bg-[#0F172A] text-white p-4 font-sans selection:bg-teal-500/30">
       <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/10 via-black to-slate-900/10 pointer-events-none"></div>

       <div class="relative w-full max-w-md bg-slate-900/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 md:p-12 shadow-2xl text-center space-y-6">
           
           <!-- Icon -->
           <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-6 animate-pulse">
               <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
               </svg>
           </div>

           <h1 class="text-3xl font-bold tracking-tight text-white">Verify your email</h1>
           
           <p class="text-slate-400 text-lg leading-relaxed">
               We sent a magic link to <span class="text-white font-semibold">{{ email }}</span>.<br/> 
               Click it to unlock your account.
           </p>

           <div class="pt-6 space-y-4">
               <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer" class="block w-full btn-primary bg-white hover:bg-slate-100 text-slate-900 font-bold py-3.5 rounded-xl shadow-lg transform active:scale-[0.98] transition-all">
                   Open Gmail
               </a>
               
               <button (click)="resend()" [disabled]="resending" class="text-indigo-400 hover:text-indigo-300 font-semibold text-sm transition-colors">
                   {{ resending ? 'Sending...' : "Didn't receive it? Resend Email" }}
               </button>
           </div>
           
           <div class="border-t border-slate-800 pt-6 mt-6">
                <a routerLink="/signup" class="text-slate-500 hover:text-slate-400 text-sm">Wrong email? Change it.</a>
           </div>

           <div *ngIf="message" class="text-green-400 text-sm animate-fade-in">{{ message }}</div>
           <div *ngIf="error" class="text-red-400 text-sm animate-fade-in">{{ error }}</div>
       </div>
    </div>

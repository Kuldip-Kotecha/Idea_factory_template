<div class="min-h-screen flex items-center justify-center bg-[#0F172A] text-white p-4 font-sans selection:bg-teal-500/30">
       <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/10 via-black to-slate-900/10 pointer-events-none"></div>

       <div class="relative w-full max-w-md bg-slate-900/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 md:p-12 shadow-2xl space-y-6">
           
           <h1 class="text-3xl font-bold tracking-tight text-white mb-2 text-center">Set New Password</h1>

           <!-- Loading / Validating Token State -->
           <div *ngIf="validatingToken" class="text-center py-8">
                <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-400">Verifying link...</p>
           </div>

           <!-- Invalid Token State -->
           <div *ngIf="!validatingToken && !tokenValid && !success" class="text-center space-y-6 animate-fade-in">
               <div class="w-16 h-16 mx-auto bg-red-500/20 rounded-full flex items-center justify-center text-red-400">
                   <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                   </svg>
               </div>
               <h3 class="text-xl font-bold text-white">Invalid or Expired Link</h3>
               <p class="text-slate-400">{{ error }}</p>
               <a routerLink="/forgot-password" class="block w-full btn-primary bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-xl transition-all">
                   Request New Link
               </a>
           </div>

           <!-- Reset Form -->
           <form *ngIf="tokenValid && !success" (ngSubmit)="onSubmit()" #resetForm="ngForm" class="space-y-6 animate-fade-in">
               <div class="space-y-1.5">
                   <label for="password" class="block text-sm font-bold text-slate-300 ml-1">New Password</label>
                   <div class="relative">
                       <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="New secure password" maxlength="128"
                           class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all hover:bg-slate-800 pr-10" required minlength="6">
                       <button type="button" (click)="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-indigo-400">
                           <span *ngIf="!showPassword" class="text-xs font-bold uppercase">Show</span>
                           <span *ngIf="showPassword" class="text-xs font-bold uppercase">Hide</span>
                       </button>
                   </div>
               </div>
               
               <div class="space-y-1.5">
                   <label for="confirm" class="block text-sm font-bold text-slate-300 ml-1">Confirm Password</label>
                   <input id="confirm" name="confirm" type="password" [(ngModel)]="confirmPassword" placeholder="Repeat password" maxlength="128"
                       class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all hover:bg-slate-800" required>
               </div>

               <div *ngIf="password && confirmPassword && password !== confirmPassword" class="text-yellow-400 text-xs font-medium">
                   Passwords do not match.
               </div>

               <button type="submit" [disabled]="loading || !password || password !== confirmPassword" class="w-full btn-primary bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl shadow-xl shadow-indigo-600/20 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                   <span *ngIf="!loading">Set New Password</span>
                   <span *ngIf="loading">Updating...</span>
               </button>
               
               <div *ngIf="error" class="text-red-400 text-sm text-center">{{ error }}</div>
           </form>
           
           <!-- Success State -->
           <div *ngIf="success" class="text-center space-y-6 animate-fade-in">
               <div class="w-20 h-20 mx-auto bg-green-500/20 rounded-full flex items-center justify-center text-green-400">
                   <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                   </svg>
               </div>
               <h3 class="text-2xl font-bold text-white">Password Reset!</h3>
               <p class="text-slate-400">Your password has been updated successfully.</p>
               <a routerLink="/login" class="block w-full btn-primary bg-white text-slate-900 font-bold py-3.5 rounded-xl shadow-lg transform active:scale-[0.98] transition-all">
                   Log in now
               </a>
           </div>

       </div>
    </div>

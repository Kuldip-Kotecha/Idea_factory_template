 <div class="min-h-screen flex items-center justify-center bg-[#0F172A] text-white p-4 font-sans selection:bg-teal-500/30">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/10 via-black to-slate-900/10 pointer-events-none"></div>
 
        <div class="relative w-full max-w-md bg-slate-900/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 md:p-12 shadow-2xl space-y-6">
            
            <div class="text-center">
                <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Forgot Password?</h1>
                <p class="text-slate-400">Enter your email and we'll send you a link to reset it.</p>
            </div>
 
            <div *ngIf="successMsg" class="p-4 bg-green-500/10 border-l-4 border-green-500 text-green-400 rounded-r text-sm animate-fade-in">
                {{ successMsg }}
            </div>
 
            <form *ngIf="!successMsg" (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="space-y-6">
                <div class="space-y-1.5">
                    <label for="email" class="block text-sm font-bold text-slate-300 ml-1">Email Address</label>
                    <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="you@example.com" maxlength="255"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all hover:bg-slate-800" required>
                </div>
 
                <button type="submit" [disabled]="loading || !email" class="w-full btn-primary bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl shadow-xl shadow-indigo-600/20 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span *ngIf="!loading">Send Reset Link</span>
                    <span *ngIf="loading">Sending...</span>
                </button>
                
                <div *ngIf="error" class="text-red-400 text-sm text-center">{{ error }}</div>
            </form>
 
            <div class="text-center border-t border-slate-800 pt-6 mt-6">
                <a routerLink="/login" class="text-slate-500 hover:text-white transition-colors font-medium">Back to Login</a>
            </div>
 
        </div>
     </div>
